name: Mi9 A16 - Linux 5.10 bring-up + KSUN 33214

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ksun-5.10-port

permissions:
  contents: read

jobs:
  linux510-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      COMMON_REPO: https://android.googlesource.com/kernel/common
      COMMON_BRANCH: android13-5.10
      DONOR_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus.git
      DONOR_BRANCH: "16.0"
      KSUN_TAG: v3.3.0

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev libncurses-dev python3 rsync unzip zip clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu dwarves device-tree-compiler

      - name: Add swap for kernel link stage
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Clone Android 5.10 common baseline
        run: |
          git clone --depth=1 --branch "${COMMON_BRANCH}" "${COMMON_REPO}" kernel510
          cd kernel510
          git rev-parse HEAD
          make kernelversion

      - name: Integrate KernelSU-Next 33214
        working-directory: kernel510
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${KSUN_TAG}"
          test -d KernelSU-Next

      - name: Configure 5.10 arm64 baseline
        working-directory: kernel510
        run: |
          export ARCH=arm64 LLVM=1
          rm -rf out && mkdir -p out
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KPROBES
          ./scripts/config --file out/.config --enable KPROBE_EVENTS
          ./scripts/config --file out/.config --enable OVERLAY_FS
          ./scripts/config --file out/.config --enable DEVTMPFS
          ./scripts/config --file out/.config --enable TMPFS
          ./scripts/config --file out/.config --disable LTO_CLANG_FULL || true
          ./scripts/config --file out/.config --disable LTO_CLANG_THIN || true
          ./scripts/config --file out/.config --disable LTO_CLANG || true
          ./scripts/config --file out/.config --enable LTO_NONE || true
          make O=out ARCH=arm64 LLVM=1 olddefconfig

      - name: Build Linux 5.10 baseline Image
        working-directory: kernel510
        run: |
          make -j2 O=out ARCH=arm64 LLVM=1 Image
          test -s out/arch/arm64/boot/Image

      - name: Build native Linux 5.10 SM8150 device trees
        working-directory: kernel510
        run: |
          make -j2 O=out ARCH=arm64 LLVM=1 dtbs
          find "$(pwd)/out/arch/arm64/boot/dts/qcom" -type f -name 'sm8150*.dtb' -print | sort | tee /tmp/sm8150-dtbs.txt
          test -s /tmp/sm8150-dtbs.txt

      - name: Clone Mi9 4.14 donor
        run: |
          git clone --depth=1 --branch "${DONOR_BRANCH}" "${DONOR_REPO}" donor414
          echo "Donor commit: $(git -C donor414 rev-parse HEAD)"

      - name: Stage 3 - inventory cepheus board DT sources
        run: |
          set -euxo pipefail
          mkdir -p port-report/donor-dts
          find donor414/arch/arm64/boot/dts -type f \( -iname '*cepheus*.dts' -o -iname '*cepheus*.dtsi' -o -iname '*sm8150*.dts' -o -iname '*sm8150*.dtsi' \) | sort | tee port-report/cepheus-5.10-inventory.txt
          test -s port-report/cepheus-5.10-inventory.txt
          while IFS= read -r f; do
            cp --parents "$f" port-report/donor-dts/
          done < port-report/cepheus-5.10-inventory.txt

      - name: Stage 3 - extract board-specific migration candidates
        run: |
          set -euxo pipefail
          mkdir -p port-report
          DONOR_FILES=$(find donor414/arch/arm64/boot/dts -type f \( -iname '*cepheus*.dts' -o -iname '*cepheus*.dtsi' \) | sort)
          {
            echo "Mi9 cepheus -> Linux 5.10 Stage 3 board DT analysis"
            echo "====================================================="
            echo
            echo "5.10 baseline: ${COMMON_BRANCH}"
            echo "4.14 donor: ${DONOR_REPO} ${DONOR_BRANCH}"
            echo "Donor commit: $(git -C donor414 rev-parse HEAD)"
            echo
            echo "Native Linux 5.10 SM8150 DTBs:"
            cat /tmp/sm8150-dtbs.txt
            echo
            echo "Cepheus board source files:"
            printf '%s\n' "$DONOR_FILES"
            echo
            echo "Board identity / compatible strings:"
            grep -HnE 'model[[:space:]]*=|compatible[[:space:]]*=' $DONOR_FILES || true
            echo
            echo "Explicitly enabled/disabled nodes:"
            grep -HnE 'status[[:space:]]*=[[:space:]]*"(okay|disabled)"' $DONOR_FILES || true
            echo
            echo "Likely board peripherals/references requiring 5.10 mapping:"
            grep -HnEi 'panel|display|dsi|touch|goodix|synaptics|focal|camera|cci|flash|audio|wcd|speaker|amp|nfc|fingerprint|fpc|goodix|battery|charger|usb|typec|wifi|wlan|bluetooth|bt|vibrator|haptics|led|gpio|regulator' $DONOR_FILES || true
          } > port-report/cepheus-5.10-stage3-analysis.txt
          sed -n '1,260p' port-report/cepheus-5.10-stage3-analysis.txt

      - name: Stage 3 - dump native 5.10 SM8150 DTB for structural comparison
        run: |
          set -euxo pipefail
          mkdir -p port-report/native510
          BASE_DTB=$(find kernel510/out/arch/arm64/boot/dts/qcom -type f -name 'sm8150-mtp*.dtb' | head -n1)
          if [ -z "$BASE_DTB" ]; then
            BASE_DTB=$(find kernel510/out/arch/arm64/boot/dts/qcom -type f -name 'sm8150*.dtb' | head -n1)
          fi
          test -n "$BASE_DTB"
          dtc -I dtb -O dts -o port-report/native510/sm8150-5.10-base.dts "$BASE_DTB"
          grep -nE 'model[[:space:]]*=|compatible[[:space:]]*=' port-report/native510/sm8150-5.10-base.dts | head -n 80 > port-report/native510/identity.txt || true

      - name: Stage 4 - compile upstream Xiaomi Mi 9 device tree baseline
        run: |
          set -u
          mkdir -p port-report/stage4
          CEPHEUS_PATCH_URL='https://patchew.org/linux/20220107025910.112425-1-alexeymin%40postmarketos.org/mbox'
          curl --fail --location --retry 3 "${CEPHEUS_PATCH_URL}" -o /tmp/cepheus-dts.mbox
          python3 - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path

          message = BytesParser(policy=policy.default).parsebytes(
              Path('/tmp/cepheus-dts.mbox').read_bytes()
          )
          payload = message.get_payload(decode=True)
          if not payload or b'sm8150-xiaomi-cepheus.dts' not in payload:
              raise SystemExit('Patchew mbox did not contain the cepheus DTS patch')
          Path('/tmp/cepheus-dts.patch').write_bytes(payload)
          PY
          grep -q 'sm8150-xiaomi-cepheus.dts' /tmp/cepheus-dts.patch

          cd kernel510
          git apply --include='arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts' /tmp/cepheus-dts.patch
          test -s arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts

          # android13-5.10 predates the pon_pwrkey label and has no
          # pon_resin child used by the 2022 cepheus DTS. Label the existing
          # power-key node and defer the optional resin key until its binding
          # and node are backported together.
          python3 - <<'PY'
          from pathlib import Path
          import re

          pmic = Path('arch/arm64/boot/dts/qcom/pm8150.dtsi')
          text = pmic.read_text()
          if 'pon_pwrkey: pwrkey {' not in text:
              text, count = re.subn(r'(?m)^(\s*)pwrkey \{', r'\1pon_pwrkey: pwrkey {', text, count=1)
              if count != 1:
                  raise SystemExit('Could not label the existing PM8150 power-key node')
          pmic.write_text(text)

          board = Path('arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts')
          text = board.read_text()
          text, count = re.subn(
              r'(?ms)^&pon_resin \{.*?^\};\n?',
              '/* pon_resin deferred: absent from android13-5.10 PM8150 baseline */\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Expected cepheus pon_resin override was not found')
          board.write_text(text)
          PY
          grep -q 'pon_pwrkey: pwrkey' arch/arm64/boot/dts/qcom/pm8150.dtsi
          grep -q 'pon_resin deferred' arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts

          if ! grep -q 'sm8150-xiaomi-cepheus.dtb' arch/arm64/boot/dts/qcom/Makefile; then
            printf '\ndtb-$(CONFIG_ARCH_QCOM) += sm8150-xiaomi-cepheus.dtb\n' >> arch/arm64/boot/dts/qcom/Makefile
          fi

          set +e
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1             qcom/sm8150-xiaomi-cepheus.dtb             2>&1 | tee ../port-report/stage4/cepheus-dtb-build.log
          DTB_STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "Stage 4 upstream cepheus DT baseline"
            echo "Source: ${CEPHEUS_PATCH_URL}"
            echo "Build status: ${DTB_STATUS}"
            echo "Safety: experimental analysis artifact; do not flash"
          } > ../port-report/stage4/STATUS.txt

          if [ "${DTB_STATUS}" -eq 0 ]; then
            test -s out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dtb
            cp out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dtb ../port-report/stage4/
            sha256sum ../port-report/stage4/sm8150-xiaomi-cepheus.dtb               > ../port-report/stage4/sm8150-xiaomi-cepheus.dtb.sha256
            echo "compile_result=success" >> ../port-report/stage4/STATUS.txt
          else
            echo "compile_result=needs_backport_fixes" >> ../port-report/stage4/STATUS.txt
          fi

      - name: Stage 5 - validate cepheus early-boot DT and pair with kernel
        run: |
          set -euxo pipefail
          DTB=kernel510/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dtb
          IMAGE=kernel510/out/arch/arm64/boot/Image
          test -s "$DTB"
          test -s "$IMAGE"
          mkdir -p port-report/stage5
          MODEL=$(fdtget -t s "$DTB" / model)
          COMPATIBLE=$(fdtget -t s "$DTB" / compatible)
          test "$MODEL" = "Xiaomi Mi 9"
          printf '%s\n' "$COMPATIBLE" | grep -q 'xiaomi,cepheus'
          dtc -I dtb -O dts -o port-report/stage5/sm8150-xiaomi-cepheus.validated.dts "$DTB"
          grep -q 'reserved-memory' port-report/stage5/sm8150-xiaomi-cepheus.validated.dts
          grep -q 'qcom,rmtfs-mem' port-report/stage5/sm8150-xiaomi-cepheus.validated.dts
          cp "$IMAGE" port-report/stage5/Image-linux-5.10-gki-ksun33214
          cp "$DTB" port-report/stage5/sm8150-xiaomi-cepheus.dtb
          {
            echo "Linux 5.10 cepheus Stage 5 early-boot pair"
            echo "Model: $MODEL"
            echo "Compatible: $COMPATIBLE"
            echo "Verified: real cepheus DTB identity, reserved-memory and RMTFS map"
            echo "Included: kernel Image and DTB as separate files"
            echo "Safety: engineering artifact only; not a boot.img and not flashable"
            echo "Missing validation: storage, display panel, touch, WLAN/BT, modem and real-device boot"
          } > port-report/stage5/STATUS.txt
          (cd port-report/stage5 && sha256sum Image-linux-5.10-gki-ksun33214 sm8150-xiaomi-cepheus.dtb > SHA256SUMS)

      - name: Stage 6 - audit storage and USB early-boot blockers
        run: |
          set -euxo pipefail
          DTS=port-report/stage5/sm8150-xiaomi-cepheus.validated.dts
          test -s "$DTS"
          mkdir -p port-report/stage6
          {
            echo "Linux 5.10 cepheus Stage 6 boot-critical audit"
            echo "Safety: analysis only; not flashable"
            echo
            echo "USB references:"
            grep -nEi 'usb|dwc3|hsphy|qmpphy|typec' "$DTS" || true
            echo
            echo "Storage references:"
            grep -nEi 'ufs|ufshc|sdhci|mmc' "$DTS" || true
            echo
            echo "Enabled nodes:"
            grep -n 'status = "okay"' "$DTS" || true
          } > port-report/stage6/boot-critical-audit.txt
          USB_COUNT=$(grep -cEi 'usb|dwc3|hsphy|qmpphy|typec' "$DTS" || true)
          STORAGE_COUNT=$(grep -cEi 'ufs|ufshc|sdhci|mmc' "$DTS" || true)
          {
            echo "usb_reference_count=$USB_COUNT"
            echo "storage_reference_count=$STORAGE_COUNT"
            echo "real_cepheus_dtb=verified"
            echo "flashable=no"
            if [ "$USB_COUNT" -gt 0 ]; then
              echo "usb_audit=present_needs_hardware_test"
            else
              echo "usb_audit=missing"
            fi
            if [ "$STORAGE_COUNT" -gt 0 ]; then
              echo "storage_audit=present_needs_mapping_review"
            else
              echo "storage_audit=blocking_missing_board_enablement"
            fi
          } > port-report/stage6/STATUS.txt
          cat port-report/stage6/STATUS.txt
          sha256sum "$DTS" > port-report/stage6/validated-dts.sha256

      - name: Stage 7 - map board-level UFS and USB dependencies
        run: |
          set -euxo pipefail
          DTS=port-report/stage5/sm8150-xiaomi-cepheus.validated.dts
          DONOR=donor414/arch/arm64/boot/dts/qcom/cepheus-sm8150.dtsi
          test -s "$DTS"
          test -s "$DONOR"
          mkdir -p port-report/stage7
          grep -nEi -B16 -A40 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DTS" > port-report/stage7/compiled-510-node-map.txt
          grep -nEi -B16 -A40 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DONOR" > port-report/stage7/donor414-node-map.txt || true
          test -s port-report/stage7/compiled-510-node-map.txt
          {
            echo "Linux 5.10 cepheus Stage 7 UFS/USB mapping"
            echo "real_cepheus_dtb=verified"
            echo "compiled510_matches=$(grep -cEi 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DTS")"
            echo "donor414_matches=$(grep -cEi 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DONOR" || true)"
            echo "flashable=no"
            echo "next=review exact status, supplies and PHY links before board changes"
          } > port-report/stage7/STATUS.txt
          cat port-report/stage7/STATUS.txt
          sha256sum port-report/stage7/*.txt > port-report/stage7/SHA256SUMS

      - name: Stage 8 - audit exact UFS and USB status, supplies and PHY links
        run: |
          set -euxo pipefail
          DTS=port-report/stage5/sm8150-xiaomi-cepheus.validated.dts
          DONOR=donor414/arch/arm64/boot/dts/qcom/cepheus-sm8150.dtsi
          test -s "$DTS"
          test -s "$DONOR"
          mkdir -p port-report/stage8

          grep -nEi -B24 -A64 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DTS" \
            > port-report/stage8/compiled510-context.txt
          grep -nEi -B24 -A64 'ufs|ufshc|usb|dwc3|hsphy|qmpphy|typec' "$DONOR" \
            > port-report/stage8/donor414-context.txt || true

          grep -nEi 'status[[:space:]]*=|phy-names|phys[[:space:]]*=|vcc.*-supply|vdd.*-supply|power-domains|clocks[[:space:]]*=|resets[[:space:]]*=' \
            port-report/stage8/compiled510-context.txt \
            > port-report/stage8/compiled510-links.txt || true
          grep -nEi 'status[[:space:]]*=|phy-names|phys[[:space:]]*=|vcc.*-supply|vdd.*-supply|power-domains|clocks[[:space:]]*=|resets[[:space:]]*=' \
            port-report/stage8/donor414-context.txt \
            > port-report/stage8/donor414-links.txt || true

          test -s port-report/stage8/compiled510-links.txt
          {
            echo "Linux 5.10 cepheus Stage 8 UFS/USB dependency audit"
            echo "real_cepheus_dtb=verified"
            echo "compiled510_link_lines=$(wc -l < port-report/stage8/compiled510-links.txt)"
            echo "donor414_link_lines=$(wc -l < port-report/stage8/donor414-links.txt)"
            echo "flashable=no"
            echo "next=review report before any DTS mutation"
          } > port-report/stage8/STATUS.txt
          sha256sum port-report/stage8/*.txt > port-report/stage8/SHA256SUMS
          cat port-report/stage8/STATUS.txt

      - name: Stage 9 - enable cepheus UFS controller and PHY
        run: |
          set -euxo pipefail
          BOARD=kernel510/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts
          test -s "$BOARD"
          mkdir -p port-report/stage9

          cat >> "$BOARD" <<'EOF'

          /*
           * Cepheus UFS rails mapped from the 4.14 donor:
           * pm8150_l10 -> vreg_l10a_2p5, pm8150_s4 -> vreg_s4a_1p8,
           * pm8150_l5 -> vreg_l5a_0p875, pm8150l_l3 -> vreg_l3c_1p2.
           */
          &ufs_mem_hc {
              vcc-supply = <&vreg_l10a_2p5>;
              vccq2-supply = <&vreg_s4a_1p8>;
              status = "okay";
          };

          &ufs_mem_phy {
              vdda-phy-supply = <&vreg_l5a_0p875>;
              vdda-pll-supply = <&vreg_l3c_1p2>;
              status = "okay";
          };
          EOF

          grep -n -A18 '&ufs_mem_hc' "$BOARD" > port-report/stage9/ufs-board-overrides.txt
          grep -n -A18 '&ufs_mem_phy' "$BOARD" >> port-report/stage9/ufs-board-overrides.txt
          grep -q 'vcc-supply = <&vreg_l10a_2p5>' "$BOARD"
          grep -q 'vccq2-supply = <&vreg_s4a_1p8>' "$BOARD"
          grep -q 'vdda-phy-supply = <&vreg_l5a_0p875>' "$BOARD"
          grep -q 'vdda-pll-supply = <&vreg_l3c_1p2>' "$BOARD"

          make -C kernel510 O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            qcom/sm8150-xiaomi-cepheus.dtb \
            2>&1 | tee port-report/stage9/cepheus-ufs-dtb-build.log
          DTB=kernel510/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dtb
          test -s "$DTB"
          dtc -I dtb -O dts -o port-report/stage9/sm8150-xiaomi-cepheus-ufs.dts "$DTB"
          grep -nEi -B12 -A55 'ufshc@1d84000|phy@1d87000' \
            port-report/stage9/sm8150-xiaomi-cepheus-ufs.dts \
            > port-report/stage9/compiled-ufs-context.txt
          grep -q 'status = "okay"' port-report/stage9/compiled-ufs-context.txt
          cp "$DTB" port-report/stage9/sm8150-xiaomi-cepheus-ufs.dtb

          {
            echo "Linux 5.10 cepheus Stage 9 UFS enablement"
            echo "real_cepheus_dtb=verified"
            echo "ufs_controller=enabled"
            echo "ufs_phy=enabled"
            echo "supply_mapping=from_cepheus_4.14_donor"
            echo "flashable=no"
            echo "next=validate display and touch dependencies before boot packaging"
          } > port-report/stage9/STATUS.txt
          (cd port-report/stage9 && sha256sum *.dtb *.txt > SHA256SUMS)
          cat port-report/stage9/STATUS.txt

      - name: Stage 10 - audit cepheus display and touch dependencies
        run: |
          set -euxo pipefail
          BOARD=kernel510/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts
          DTB=kernel510/out/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dtb
          DONOR_ROOT=donor414/arch/arm64/boot/dts
          test -s "$BOARD"
          test -s "$DTB"
          mkdir -p port-report/stage10

          grep -nEi -B20 -A60 'framebuffer|display|dsi|mdss|panel' "$BOARD" \
            > port-report/stage10/compiled510-display-source.txt || true
          grep -RniE -B12 -A45 'display|dsi|mdss|panel|1080|2340' "$DONOR_ROOT/qcom" \
            --include='*cepheus*' --include='*xiaomi-sm8150*' \
            > port-report/stage10/donor414-display-map.txt || true
          grep -RniE -B12 -A45 'touch|touchscreen|goodix|synaptics|focaltech|fts' "$DONOR_ROOT/qcom" \
            --include='*cepheus*' --include='*xiaomi-sm8150*' \
            > port-report/stage10/donor414-touch-map.txt || true

          dtc -I dtb -O dts -o port-report/stage10/sm8150-xiaomi-cepheus-stage10.dts "$DTB"
          grep -nEi -B20 -A60 'framebuffer|display|dsi|mdss|panel|touch|touchscreen|goodix|synaptics|focaltech|fts' \
            port-report/stage10/sm8150-xiaomi-cepheus-stage10.dts \
            > port-report/stage10/compiled510-display-touch-map.txt || true

          SIMPLE_FB_COUNT=$(grep -cEi 'simple-framebuffer|framebuffer@' "$BOARD" || true)
          PANEL_COUNT=$(grep -cEi 'panel@|qcom,mdss-dsi|dsi-panel' "$BOARD" || true)
          TOUCH_COUNT=$(grep -cEi 'touchscreen|goodix|synaptics|focaltech|fts' "$BOARD" || true)
          DONOR_TOUCH_COUNT=$(grep -RciE 'touchscreen|goodix|synaptics|focaltech|fts' "$DONOR_ROOT/qcom" \
            --include='*cepheus*' --include='*xiaomi-sm8150*' | awk -F: '{s+=$2} END {print s+0}')
          {
            echo "Linux 5.10 cepheus Stage 10 display/touch audit"
            echo "real_cepheus_dtb=verified"
            echo "simple_framebuffer_references=$SIMPLE_FB_COUNT"
            echo "native_panel_references=$PANEL_COUNT"
            echo "native_touch_references=$TOUCH_COUNT"
            echo "donor_touch_references=$DONOR_TOUCH_COUNT"
            echo "flashable=no"
            if [ "$SIMPLE_FB_COUNT" -gt 0 ]; then
              echo "early_display=simple_framebuffer_present"
            else
              echo "early_display=blocking_missing"
            fi
            if [ "$PANEL_COUNT" -eq 0 ]; then
              echo "native_panel=not_ported"
            else
              echo "native_panel=present_needs_driver_validation"
            fi
            if [ "$TOUCH_COUNT" -eq 0 ]; then
              echo "touch=not_ported"
            else
              echo "touch=present_needs_driver_validation"
            fi
            echo "next=select exact donor panel and touch nodes plus matching 5.10 drivers"
          } > port-report/stage10/STATUS.txt
          sha256sum port-report/stage10/*.txt > port-report/stage10/SHA256SUMS
          cat port-report/stage10/STATUS.txt

      - name: Stage 11 - identify exact panel and touch driver candidates
        run: |
          set -euxo pipefail
          DONOR_DTS=donor414/arch/arm64/boot/dts/qcom
          K510=kernel510
          mkdir -p port-report/stage11

          grep -RniE -B18 -A50 'compatible[[:space:]]*=.*(panel|dsi|goodix|synaptics|focal|fts|touch)' "$DONOR_DTS" \
            --include='*cepheus*' --include='*xiaomi-sm8150*' \
            > port-report/stage11/donor-compatible-context.txt || true
          grep -RniE 'compatible[[:space:]]*=' "$DONOR_DTS" \
            --include='*cepheus*' --include='*xiaomi-sm8150*' \
            | grep -Ei 'panel|dsi|goodix|synaptics|focal|fts|touch' \
            > port-report/stage11/donor-compatible-lines.txt || true

          grep -RniE 'goodix|synaptics|focaltech|fts|touchscreen' \
            "$K510/drivers/input/touchscreen" "$K510/Documentation/devicetree/bindings/input" \
            > port-report/stage11/kernel510-touch-driver-inventory.txt || true
          grep -RniE 'xiaomi|cepheus|samsung|panel|dsi' \
            "$K510/drivers/gpu/drm/panel" "$K510/Documentation/devicetree/bindings/display" \
            > port-report/stage11/kernel510-panel-driver-inventory.txt || true

          DONOR_COMPAT_COUNT=$(wc -l < port-report/stage11/donor-compatible-lines.txt)
          TOUCH_DRIVER_COUNT=$(wc -l < port-report/stage11/kernel510-touch-driver-inventory.txt)
          PANEL_DRIVER_COUNT=$(wc -l < port-report/stage11/kernel510-panel-driver-inventory.txt)
          {
            echo "Linux 5.10 cepheus Stage 11 driver candidate selection"
            echo "donor_display_touch_compatible_lines=$DONOR_COMPAT_COUNT"
            echo "kernel510_touch_driver_matches=$TOUCH_DRIVER_COUNT"
            echo "kernel510_panel_driver_matches=$PANEL_DRIVER_COUNT"
            echo "simple_framebuffer=retained"
            echo "flashable=no"
            if [ "$DONOR_COMPAT_COUNT" -eq 0 ]; then
              echo "candidate_selection=blocked_no_exact_compatible"
            else
              echo "candidate_selection=report_ready"
            fi
            echo "next=port only compatible-matched nodes and required drivers"
          } > port-report/stage11/STATUS.txt
          sha256sum port-report/stage11/*.txt > port-report/stage11/SHA256SUMS
          cat port-report/stage11/STATUS.txt
          sed -n '1,160p' port-report/stage11/donor-compatible-lines.txt

      - name: Stage 12 - validate ST FTS touch port prerequisites
        run: |
          set -euxo pipefail
          DONOR=donor414/arch/arm64/boot/dts/qcom/cepheus-sm8150.dtsi
          DONOR_DTS=donor414/arch/arm64/boot/dts/qcom
          K510=kernel510
          BOARD=$K510/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts
          mkdir -p port-report/stage12
          test -s "$DONOR"
          test -s "$BOARD"

          grep -n -B8 -A45 'compatible = "st,fts"' "$DONOR" \
            > port-report/stage12/donor-st-fts-node.txt
          grep -RniE -B10 -A35 '(^|[[:space:]])(ts_active|ts_int_suspend|ts_reset_suspend)(:|[[:space:]])' "$DONOR_DTS" \
            > port-report/stage12/donor-st-fts-pinctrl.txt || true
          grep -RniE 'compatible[[:space:]]*=[[:space:]]*"st,fts"|st,fts|CONFIG_TOUCHSCREEN.*FTS|TOUCHSCREEN_FTS' \
            "$K510/drivers/input/touchscreen" "$K510/Documentation/devicetree/bindings/input" "$K510/drivers/input/touchscreen/Kconfig" \
            > port-report/stage12/kernel510-st-fts-driver.txt || true
          grep -RniE 'qupv3_se17_i2c|i2c@.*(a|b|c|d|e|f)?[0-9a-f]+' \
            "$K510/arch/arm64/boot/dts/qcom/sm8150.dtsi" "$BOARD" \
            > port-report/stage12/kernel510-i2c17-map.txt || true
          grep -nE 'vreg_l1c_1p8|vreg_l1c|regulator-name.*l1' "$BOARD" \
            > port-report/stage12/kernel510-touch-supply-map.txt || true

          DRIVER_MATCHES=$(wc -l < port-report/stage12/kernel510-st-fts-driver.txt)
          I2C_MATCHES=$(wc -l < port-report/stage12/kernel510-i2c17-map.txt)
          PINCTRL_MATCHES=$(wc -l < port-report/stage12/donor-st-fts-pinctrl.txt)
          SUPPLY_MATCHES=$(wc -l < port-report/stage12/kernel510-touch-supply-map.txt)
          {
            echo "Linux 5.10 cepheus Stage 12 ST FTS touch prerequisites"
            echo "touch_compatible=st,fts"
            echo "i2c_address=0x49"
            echo "irq_gpio=122"
            echo "reset_gpio=12"
            echo "resolution=1080x2340"
            echo "kernel510_driver_matches=$DRIVER_MATCHES"
            echo "kernel510_i2c17_matches=$I2C_MATCHES"
            echo "donor_pinctrl_matches=$PINCTRL_MATCHES"
            echo "kernel510_supply_matches=$SUPPLY_MATCHES"
            echo "flashable=no"
            if [ "$DRIVER_MATCHES" -eq 0 ]; then
              echo "touch_port=blocked_missing_st_fts_driver"
            elif [ "$I2C_MATCHES" -eq 0 ] || [ "$PINCTRL_MATCHES" -eq 0 ] || [ "$SUPPLY_MATCHES" -eq 0 ]; then
              echo "touch_port=blocked_missing_dt_dependency"
            else
              echo "touch_port=ready_for_controlled_dts_port"
            fi
            echo "next=backport exact driver if absent, otherwise add only verified node and pins"
          } > port-report/stage12/STATUS.txt
          sha256sum port-report/stage12/*.txt > port-report/stage12/SHA256SUMS
          cat port-report/stage12/STATUS.txt

      - name: Stage 13 - resolve QUPv3 SE17 controller mapping
        run: |
          set -euxo pipefail
          DONOR=donor414/arch/arm64/boot/dts/qcom/cepheus-sm8150.dtsi
          DONOR_DTS=donor414/arch/arm64/boot/dts/qcom
          K510_DTS=kernel510/arch/arm64/boot/dts/qcom
          BOARD=$K510_DTS/sm8150-xiaomi-cepheus.dts
          mkdir -p port-report/stage13
          test -s "$DONOR"
          test -s "$BOARD"

          grep -RniE -B12 -A45 'qupv3_se17_i2c|i2c.*(se|serial.engine).*17|serial.engine.*17' "$DONOR_DTS" \
            > port-report/stage13/donor-se17-context.txt || true
          grep -RniE -B12 -A45 'qupv3|geni-se|qcom,geni|i2c@[0-9a-f]+' "$K510_DTS/sm8150.dtsi" "$BOARD" \
            > port-report/stage13/kernel510-qupv3-controller-context.txt || true
          grep -RniE 'aliases|i2c[0-9]+[[:space:]]*=|qupv3_[a-zA-Z0-9_]+|serial-engine|qcom,wrapper-core' "$K510_DTS" \
            > port-report/stage13/kernel510-qupv3-label-alias-map.txt || true
          grep -RniE 'SE_GENI|GENI_SE|QUPV3|I2C.*SE|SE.*I2C' \
            kernel510/drivers/i2c kernel510/drivers/soc/qcom kernel510/include kernel510/Documentation \
            > port-report/stage13/kernel510-geni-driver-evidence.txt || true

          DONOR_MATCHES=$(wc -l < port-report/stage13/donor-se17-context.txt)
          CONTROLLER_MATCHES=$(wc -l < port-report/stage13/kernel510-qupv3-controller-context.txt)
          LABEL_MATCHES=$(wc -l < port-report/stage13/kernel510-qupv3-label-alias-map.txt)
          DRIVER_MATCHES=$(wc -l < port-report/stage13/kernel510-geni-driver-evidence.txt)
          {
            echo "Linux 5.10 cepheus Stage 13 QUPv3 SE17 mapping"
            echo "donor_se17_context_lines=$DONOR_MATCHES"
            echo "kernel510_controller_context_lines=$CONTROLLER_MATCHES"
            echo "kernel510_label_alias_lines=$LABEL_MATCHES"
            echo "kernel510_geni_driver_lines=$DRIVER_MATCHES"
            echo "flashable=no"
            if [ "$DONOR_MATCHES" -eq 0 ]; then
              echo "se17_mapping=blocked_missing_donor_label"
            elif [ "$CONTROLLER_MATCHES" -eq 0 ] || [ "$LABEL_MATCHES" -eq 0 ]; then
              echo "se17_mapping=blocked_missing_5_10_controller_identity"
            else
              echo "se17_mapping=evidence_collected_for_manual_identity_check"
            fi
            echo "next=identify the exact 5.10 controller address and label before adding the st,fts node"
          } > port-report/stage13/STATUS.txt
          sha256sum port-report/stage13/*.txt > port-report/stage13/SHA256SUMS
          cat port-report/stage13/STATUS.txt

      - name: Stage 14 - prove SE17 MMIO identity against native 5.10
        run: |
          set -euxo pipefail
          mkdir -p port-report/stage14
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          donor_root = Path("donor414/arch/arm64/boot/dts/qcom")
          native_files = [
              Path("kernel510/arch/arm64/boot/dts/qcom/sm8150.dtsi"),
              Path("kernel510/arch/arm64/boot/dts/qcom/sm8150-xiaomi-cepheus.dts"),
          ]

          declaration = re.compile(
              r"(?m)^\s*(?P<label>[A-Za-z_][\w-]*)\s*:\s*"
              r"(?P<node>[A-Za-z0-9_,.+-]+)@(?P<unit>[0-9a-fA-F]+)\s*\{"
          )

          def block(text, start):
              opening = text.find("{", start)
              if opening < 0:
                  return ""
              depth = 0
              for pos in range(opening, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:pos + 2]
              return text[start:]

          donor = []
          for path in donor_root.rglob("*"):
              if path.suffix not in {".dts", ".dtsi"}:
                  continue
              text = path.read_text(errors="replace")
              for match in declaration.finditer(text):
                  if match.group("label") != "qupv3_se17_i2c":
                      continue
                  body = block(text, match.start())
                  regs = re.findall(r"(?m)^\s*reg\s*=\s*<([^;]+)>;", body)
                  donor.append({
                      "path": str(path),
                      "label": match.group("label"),
                      "node": match.group("node"),
                      "unit_address": match.group("unit").lower(),
                      "reg": regs[:2],
                      "source": body,
                  })

          native = []
          for path in native_files:
              text = path.read_text(errors="replace")
              for match in declaration.finditer(text):
                  if "i2c" not in match.group("node").lower():
                      continue
                  body = block(text, match.start())
                  regs = re.findall(r"(?m)^\s*reg\s*=\s*<([^;]+)>;", body)
                  native.append({
                      "path": str(path),
                      "label": match.group("label"),
                      "node": match.group("node"),
                      "unit_address": match.group("unit").lower(),
                      "reg": regs[:2],
                      "source": body,
                  })

          donor_units = {item["unit_address"] for item in donor}
          exact = [item for item in native if item["unit_address"] in donor_units]
          report = {
              "donor_label": "qupv3_se17_i2c",
              "donor_definitions": donor,
              "native_510_i2c_nodes": native,
              "exact_unit_address_matches": exact,
          }
          Path("port-report/stage14/se17-mmio-identity.json").write_text(
              json.dumps(report, indent=2, sort_keys=True)
          )
          Path("port-report/stage14/donor-definition.txt").write_text(
              "\n\n".join(item["source"] for item in donor)
          )
          Path("port-report/stage14/native-i2c-candidates.txt").write_text(
              "\n\n".join(item["source"] for item in native)
          )

          if len(donor) == 1 and len(exact) == 1:
              state = "exact_single_address_match"
              next_step = "verify parent QUP wrapper, clocks and pinctrl before controlled DTS port"
          elif not donor:
              state = "blocked_donor_label_definition_not_found"
              next_step = "locate generated or included donor definition; do not mutate DTS"
          elif not exact:
              state = "blocked_no_native_5_10_address_match"
              next_step = "resolve downstream-to-upstream address translation; do not mutate DTS"
          else:
              state = "blocked_ambiguous_address_match"
              next_step = "disambiguate parent wrapper and clocks; do not mutate DTS"

          status = [
              "Linux 5.10 cepheus Stage 14 SE17 MMIO identity proof",
              f"donor_definition_count={len(donor)}",
              f"native_i2c_candidate_count={len(native)}",
              f"exact_unit_address_match_count={len(exact)}",
              f"se17_identity={state}",
              "dts_mutated=no",
              "flashable=no",
              f"next={next_step}",
          ]
          Path("port-report/stage14/STATUS.txt").write_text("\n".join(status) + "\n")
          PY
          test -s port-report/stage14/se17-mmio-identity.json
          test -s port-report/stage14/STATUS.txt
          sha256sum port-report/stage14/*.txt port-report/stage14/*.json > port-report/stage14/SHA256SUMS
          cat port-report/stage14/STATUS.txt

      - name: Stage 3 - generate migration plan
        run: |
          cat > port-report/README-STAGE3.txt <<'EOF'
          Linux 5.10 cepheus bring-up - Stage 14

          This artifact intentionally does NOT rename sm8150-mtp.dtb to cepheus.dtb.
          A renamed MTP DTB is not a Xiaomi Mi 9 board DT and is unsafe to treat as flash-ready.

          Next porting order:
          1. Start from the native Linux 5.10 SM8150 SoC description.
          2. Port cepheus regulators/GPIO/pinctrl and reserved-memory references.
          3. Port storage/USB/Type-C and basic power/charger nodes needed for boot.
          4. Port display/touch.
          5. Port audio, WLAN/BT, fingerprint, NFC, cameras and remaining peripherals.
          6. Compile a real cepheus DTB and only then move to boot.img/AnyKernel packaging.

          stage4/ contains the first real Xiaomi Mi 9 DT compile attempt and its complete build log.\n          stage5/ contains the validated real cepheus DTB paired with the 5.10 kernel Image; it is not flashable.\n          stage6/ audits storage and USB boot-critical nodes and records explicit blockers.\n          stage7/ maps compiled 5.10 UFS/USB context against the 4.14 cepheus donor.\n          stage8/ audits exact status, supply, clock, reset and PHY-link evidence before DTS edits.\n          stage9/ enables the native 5.10 UFS controller/PHY with cepheus donor rail mappings and recompiles the real DTB.\n          stage10/ audits simple-framebuffer, native panel/DSI and touchscreen dependencies without claiming hardware support.\n          stage11/ identifies exact donor compatible strings and checks matching 5.10 panel/touch drivers before porting nodes.\n          stage12/ validates the exact st,fts touch driver, I2C17, GPIO pinctrl and regulator prerequisites.\n          stage13/ collects donor and native QUPv3 SE17 controller evidence.
          stage14/ proves the donor SE17 unit address against native 5.10 I2C nodes; it does not mutate DTS.
          native510/sm8150-5.10-base.dts is the decompiled 5.10 reference structure.
          EOF

      - name: Package Stage 5 artifacts
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist/dtbs
          cp kernel510/out/arch/arm64/boot/Image dist/Image-linux-5.10-gki-ksun33214
          cp kernel510/out/.config dist/config-linux-5.10-gki-ksun33214
          cp -a port-report/. dist/
          find kernel510/out/arch/arm64/boot/dts/qcom -type f -name 'sm8150*.dtb' -exec cp -v {} dist/dtbs/ \;
          test -s dist/Image-linux-5.10-gki-ksun33214
          test -s dist/cepheus-5.10-stage3-analysis.txt
          test "$(find dist/dtbs -type f -name '*.dtb' | wc -l)" -gt 0
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload 5.10 Stage 14 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-Linux510-Stage14-Cepheus-SE17-MMIO-Proof-KSUN33214
          path: dist/
          if-no-files-found: error

name: Mi9 crDroid A16 - Linux 4.14.355 + KSUN 33214

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus.git
      KERNEL_BRANCH: "16.0"
      DEFCONFIG: cepheus_defconfig
      KSUN_TAG: v3.3.0
      ZIP_NAME: InfiniR-cepheus-4.14.355-A16-KSUN-v3.3.0-33214.zip

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev libyaml-dev \
            python3 rsync unzip zip \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone crDroid cepheus Android 16 kernel
        run: |
          git clone --depth=1 --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" kernel
          cd kernel
          echo "Source commit:"
          git rev-parse HEAD
          echo "Kernel version from Makefile:"
          make kernelversion

      - name: Integrate KernelSU-Next v3.3.0
        working-directory: kernel
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${KSUN_TAG}"
          echo "KernelSU integration paths:"
          find . -maxdepth 2 -type d \( -name 'KernelSU*' -o -name 'kernelsu*' \) -print

      - name: Patch legacy build compatibility
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def apply_patch(filepath, desc, fn):
              p = Path(filepath)
              if not p.exists():
                  print(f"  [SKIP] {filepath} not found")
                  return
              s = p.read_text()
              try:
                  result = fn(s)
                  if result is not None and result != s:
                      p.write_text(result)
                      print(f"  [PATCH] {filepath}: {desc}")
                  else:
                      print(f"  [OK]    {filepath}: {desc} (already compatible)")
              except Exception as e:
                  print(f"  [WARN]  {filepath}: {desc} failed: {e}")

          # 1. DTC Makefile: 4.14 用 HOSTLOADLIBES 而非 HOSTLDLIBS
          def patch_dtc(s):
              if 'HOSTLOADLIBES_dtc' in s:
                  return None
              # 在 HOSTLDLIBS_dtc 行后面添加 HOSTLOADLIBES_dtc 别名
              if 'HOSTLDLIBS_dtc' in s:
                  s = s.replace('HOSTLDLIBS_dtc\t:= $(shell pkg-config yaml-0.1 --libs)',
                                'HOSTLDLIBS_dtc\t:= $(shell pkg-config yaml-0.1 --libs)\nHOSTLOADLIBES_dtc := $(HOSTLDLIBS_dtc)')
                  return s
              return None
          apply_patch('scripts/dtc/Makefile', 'HOSTLOADLIBES_dtc 4.14 compat', patch_dtc)', patch_dtc)

          # 2. Makefile.lib: mkdtimg python2 -> python3
          def patch_mkdtimg(s):
              if 'cmd_mkdtimg = python3 ' in s:
                  return None
              return s.replace('python2 $(srctree)/scripts/dtc/mkdtboimg.py',
                               'python3 $(srctree)/scripts/dtc/mkdtboimg.py')
          apply_patch('scripts/Makefile.lib', 'mkdtimg python3', patch_mkdtimg)

          # 3. mkdtboimg.py: python2 -> python3
          def patch_mkdtbo(s):
              changed = False
              if 'xrange(' in s:
                  s = s.replace('xrange(', 'range(')
                  changed = True
              if 'if version is 0:' in s:
                  s = s.replace('if version is 0:', 'if version == 0:')
                  changed = True
              if 'dt_entry_buf = ""\n' in s:
                  s = s.replace('dt_entry_buf = ""\n', 'dt_entry_buf = b""\n', 1)
                  changed = True
              if "array('c'" in s:
                  s = re.sub(r"self\.__metadata = array\('c',\s*' '\s*\*\s*self\.__metadata_size\)",
                             "self.__metadata = bytearray(self.__metadata_size)", s)
                  changed = True
              return s if changed else None
          apply_patch('scripts/dtc/mkdtboimg.py', 'python3 compat', patch_mkdtbo)

          # 4. syscall_hook.h: aarch64 syscall_fn_t typedef
          def patch_syscall_hook(s):
              if 'typedef long (*syscall_fn_t)' in s:
                  return None
              old = '#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n#endif\n'
              new = ('#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n'
                     '#elif defined(__aarch64__)\ntypedef long (*syscall_fn_t)(const struct pt_regs *regs);\n#endif\n')
              if old in s:
                  return s.replace(old, new, 1)
              return None
          apply_patch('KernelSU-Next/kernel/hook/syscall_hook.h', 'aarch64 syscall_fn_t', patch_syscall_hook)

          # 5. sulog.h: add init.h
          def patch_sulog(s):
              if '#include <linux/init.h>' in s:
                  return None
              if '#include <linux/types.h>' in s:
                  return s.replace('#include <linux/types.h>\n',
                                   '#include <linux/types.h>\n#include <linux/init.h>\n', 1)
              return None
          apply_patch('KernelSU-Next/kernel/feature/sulog.h', 'init.h include', patch_sulog)

          # 6. sucompat.c: pgtable + strncpy_from_user_nofault
          def patch_sucompat(s):
              changed = False
              if '#include <linux/pgtable.h>' in s:
                  s = s.replace('#include <linux/pgtable.h>', '#include <asm/pgtable.h>')
                  changed = True
              if 'define strncpy_from_user_nofault' not in s:
                  compat = ('\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)\n'
                            '#define strncpy_from_user_nofault(dst, src, count) \\\n'
                            '    strncpy_from_user((dst), (src), (count))\n'
                            '#endif\n')
                  if '#include "util.h"\n' in s:
                      s = s.replace('#include "util.h"\n', '#include "util.h"\n' + compat, 1)
                      changed = True
              return s if changed else None
          apply_patch('KernelSU-Next/kernel/feature/sucompat.c', '4.14 pgtable+strncpy', patch_sucompat)

          # 7. syscall_event_bridge.c: uaccess.h
          def patch_event_bridge(s):
              if '#include <linux/uaccess.h>' in s:
                  return None
              if '#include <linux/ptrace.h>\n' in s:
                  return s.replace('#include <linux/ptrace.h>\n',
                                   '#include <linux/ptrace.h>\n#include <linux/uaccess.h>\n', 1)
              return None
          apply_patch('KernelSU-Next/kernel/hook/syscall_event_bridge.c', 'uaccess.h', patch_event_bridge)

          # 8. util.h: ksu_close_fd 4.14 compat (sys_close)
          def patch_util(s):
              if '#define ksu_close_fd sys_close' in s:
                  return None
              old = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                     '#define ksu_close_fd close_fd\n'
                     '#else\n'
                     '#define ksu_close_fd ksys_close\n'
                     '#endif\n')
              new = ('#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                     '#define ksu_close_fd close_fd\n'
                     '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 17, 0)\n'
                     '#define ksu_close_fd ksys_close\n'
                     '#else\n'
                     '#define ksu_close_fd sys_close\n'
                     '#endif\n')
              if old in s:
                  return s.replace(old, new, 1)
              return None
          apply_patch('KernelSU-Next/kernel/include/util.h', 'ksu_close_fd 4.14', patch_util)

          # 9. lsm_hook.c: 4.14 list_head compat (crDroid 4.14 may use list_head)
          def patch_lsm(s):
              if 'ksu_lsm_for_each_entry' in s:
                  return None  # already patched
              changed = False
              # list_head vs hlist_head for < 4.17
              old = '#else\n    unsigned long heads_addr;\n    struct hlist_head *head;\n'
              new = ('#else\n    unsigned long heads_addr;\n'
                     '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                     '    struct list_head *head;\n#else\n    struct hlist_head *head;\n#endif\n')
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
              # iterator macro
              if 'ksu_lsm_for_each_entry' not in s and 'static int ksu_lsm_hook_count;\n' in s:
                  macros = ('\n#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                            '#define ksu_lsm_for_each_entry(pos, head) list_for_each_entry(pos, head, list)\n'
                            '#else\n'
                            '#define ksu_lsm_for_each_entry(pos, head) hlist_for_each_entry(pos, head, list)\n'
                            '#endif\n')
                  s = s.replace('static int ksu_lsm_hook_count;\n',
                                'static int ksu_lsm_hook_count;\n' + macros, 1)
                  changed = True
              s = s.replace('hlist_for_each_entry (entry, head, list)', 'ksu_lsm_for_each_entry(entry, head)')
              return s if changed else None
          apply_patch('KernelSU-Next/kernel/hook/lsm_hook.c', '4.14 list_head compat', patch_lsm)

          print("=== Compatibility patch done (tolerant mode) ===")
          PY
      - name: Patch 4.14 missing KSU symbols
        working-directory: kernel
        run: |
          cp ../patch/ksu_compat_414.c KernelSU-Next/kernel/compat_414.c
          if ! grep -q 'compat_414.o' KernelSU-Next/kernel/Kbuild; then
            sed -i '/^kernelsu-objs := core\/init.o/a\kernelsu-objs += compat_414.o' KernelSU-Next/kernel/Kbuild
          fi
          echo "=== Kbuild compat entry ==="
          grep compat_414 KernelSU-Next/kernel/Kbuild
          echo "=== compat file size ==="
          wc -l KernelSU-Next/kernel/compat_414.c

      - name: Configure cepheus kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "${DEFCONFIG}"
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KPROBES
          ./scripts/config --file out/.config --enable KPROBE_EVENTS
          ./scripts/config --file out/.config --enable KSU_KPROBE_HOOKS || true
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- olddefconfig
          echo "Relevant final config:"
          grep -E 'CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)=' out/.config || true

      - name: Build Image.gz-dtb
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "Toolchain versions:"
          clang --version | head -n1
          aarch64-linux-gnu-ld --version | head -n1
          arm-linux-gnueabi-ld --version | head -n1

          make \
            O=out ARCH=arm64 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)"

          test -f out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee ../Image.gz-dtb.sha256

      - name: Prepare AnyKernel3 flashable ZIP
        working-directory: kernel
        run: |
          if [ ! -d AnyKernel3 ] || [ ! -f AnyKernel3/anykernel.sh ]; then
            rm -rf AnyKernel3
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          if [ -f AnyKernel3/anykernel.sh ]; then
            sed -i \
              -e 's/^device\.name1=.*/device.name1=cepheus/' \
              -e 's/^device\.name2=.*/device.name2=/' \
              -e 's/^device\.name3=.*/device.name3=/' \
              -e 's/^device\.name4=.*/device.name4=/' \
              -e 's/^device\.name5=.*/device.name5=/' \
              AnyKernel3/anykernel.sh || true
          fi
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' '.github/*' 'README.md' '*.zip'
          cd ..
          test -f "${ZIP_NAME}"
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"

      - name: Build report
        working-directory: kernel
        run: |
          {
            echo "Device: Xiaomi Mi 9 (cepheus)"
            echo "ROM target: crDroid 12.11 / Android 16"
            echo "Kernel source: ${KERNEL_REPO} branch ${KERNEL_BRANCH}"
            echo "Kernel version: $(make kernelversion)"
            echo "KernelSU-Next target: ${KSUN_TAG} / manager build 33214"
            echo
            echo "ZIP SHA256:"
            cat "${ZIP_NAME}.sha256"
          } | tee build-report.txt

      - name: Upload flashable package
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-cepheus-4.14.355-KSUN-33214
          path: |
            kernel/${{ env.ZIP_NAME }}
            kernel/${{ env.ZIP_NAME }}.sha256
            kernel/build-report.txt
            Image.gz-dtb.sha256
          if-no-files-found: error
          retention-days: 14

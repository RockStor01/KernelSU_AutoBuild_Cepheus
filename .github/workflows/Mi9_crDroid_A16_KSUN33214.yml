name: Mi9 crDroid A16 - Linux 4.14.355 + KSUN 33214

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ksun-4.14-patch-memory

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus.git
      KERNEL_BRANCH: "16.0"
      DEFCONFIG: cepheus_defconfig
      KSUN_TAG: v3.3.0
      ZIP_NAME: InfiniR-cepheus-4.14.355-A16-KSUN-v3.3.0-33214-EXPERIMENTAL-NISLOT-DISPATCHER.zip

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 rsync unzip zip \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone crDroid cepheus Android 16 kernel
        run: |
          git clone --depth=1 --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" kernel
          cd kernel
          echo "Source commit:"
          git rev-parse HEAD
          echo "Kernel version from Makefile:"
          make kernelversion

      - name: Integrate KernelSU-Next v3.3.0
        working-directory: kernel
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${KSUN_TAG}"
          echo "KernelSU integration paths:"
          find . -maxdepth 2 -type d \( -name 'KernelSU*' -o -name 'kernelsu*' \) -print

      - name: Patch legacy build compatibility
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/dtc/Makefile')
          s = p.read_text()
          if 'HOSTLDLIBS_dtc' in s and 'yamltree.o' in s:
              start = s.find('ifeq ($(shell pkg-config --exists yaml-0.1')
              if start >= 0:
                  end = s.find('endif', start)
                  if end >= 0:
                      end = s.find('\n', end)
                      if end < 0:
                          end = len(s)
                      s = s[:start] + 'HOST_EXTRACFLAGS += -DNO_YAML\n' + s[end+1:]
          if '-DNO_YAML' not in s:
              raise SystemExit('Failed to disable DTC YAML support')
          p.write_text(s)

          p = Path('scripts/Makefile.lib')
          s = p.read_text()
          s = s.replace(
              'cmd_mkdtimg = python2 $(srctree)/scripts/dtc/mkdtboimg.py create $@ --page_size=4096 $(filter-out FORCE,$^)',
              'cmd_mkdtimg = python3 $(srctree)/scripts/dtc/mkdtboimg.py create $@ --page_size=4096 $(filter-out FORCE,$^)'
          )
          if 'cmd_mkdtimg = python3 ' not in s:
              raise SystemExit('Expected mkdtimg command not found')
          p.write_text(s)

          p = Path('scripts/dtc/mkdtboimg.py')
          s = p.read_text()
          s = s.replace('xrange(', 'range(')
          s = s.replace('if version is 0:', 'if version == 0:')
          if '        dt_entry_buf = ""\n' in s:
              s = s.replace('        dt_entry_buf = ""\n', '        dt_entry_buf = b""\n', 1)
          if "        self.__metadata = array('c', ' ' * self.__metadata_size)\n" in s:
              s = s.replace(
                  "        self.__metadata = array('c', ' ' * self.__metadata_size)\n",
                  "        self.__metadata = bytearray(self.__metadata_size)\n",
                  1
              )
          if 'dt_entry_buf = b""' not in s or 'bytearray(self.__metadata_size)' not in s:
              raise SystemExit('DTBO Python3 byte-buffer patch failed')
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/hook/syscall_hook.h')
          s = p.read_text()
          if 'typedef long (*syscall_fn_t)(const struct pt_regs *regs);' not in s:
              s = s.replace(
                  '#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n#endif\n',
                  '#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n'
                  '#elif defined(__aarch64__)\ntypedef long (*syscall_fn_t)(const struct pt_regs *regs);\n#endif\n'
              )
          if 'typedef long (*syscall_fn_t)(const struct pt_regs *regs);' not in s:
              raise SystemExit('syscall_fn_t patch failed')
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/feature/sulog.h')
          s = p.read_text()
          if '#include <linux/init.h>' not in s:
              s = s.replace('#include <linux/types.h>\n', '#include <linux/types.h>\n#include <linux/init.h>\n')
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/feature/sucompat.c')
          s = p.read_text()
          s = s.replace('#include <linux/pgtable.h>', '#include <asm/pgtable.h>')
          compat = """
          #if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)
          #define strncpy_from_user_nofault(dst, src, count) \
              strncpy_from_user((dst), (src), (count))
          #endif
          """
          if 'define strncpy_from_user_nofault' not in s:
              marker = '#include "util.h"\n'
              if marker not in s:
                  raise SystemExit('Expected util.h include not found in sucompat.c')
              s = s.replace(marker, marker + compat, 1)
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/hook/syscall_event_bridge.c')
          s = p.read_text()
          if '#include <linux/uaccess.h>' not in s:
              marker = '#include <linux/ptrace.h>\n'
              if marker not in s:
                  raise SystemExit('Expected ptrace include not found in syscall_event_bridge.c')
              s = s.replace(marker, marker + '#include <linux/uaccess.h>\n', 1)
          if '#include <linux/uaccess.h>' not in s:
              raise SystemExit('uaccess include patch failed')
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/include/util.h')
          s = p.read_text()
          if '#define ksu_close_fd sys_close' not in s:
              s = s.replace(
                  '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                  '#define ksu_close_fd close_fd\n'
                  '#else\n'
                  '#define ksu_close_fd ksys_close\n'
                  '#endif\n',
                  '#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 11, 0)\n'
                  '#define ksu_close_fd close_fd\n'
                  '#elif LINUX_VERSION_CODE >= KERNEL_VERSION(4, 17, 0)\n'
                  '#define ksu_close_fd ksys_close\n'
                  '#else\n'
                  '#define ksu_close_fd sys_close\n'
                  '#endif\n'
              )
          if '#define ksu_close_fd sys_close' not in s:
              raise SystemExit('ksu_close_fd patch failed')
          p.write_text(s)

          p = Path('KernelSU-Next/kernel/hook/lsm_hook.c')
          s = p.read_text()

          old = ('#else\n'
                 '    unsigned long heads_addr;\n'
                 '    struct hlist_head *head;\n'
                 '    struct security_hook_list *selected_entry = NULL;\n')
          new = ('#else\n'
                 '    unsigned long heads_addr;\n'
                 '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                 '    struct list_head *head;\n'
                 '#else\n'
                 '    struct hlist_head *head;\n'
                 '#endif\n'
                 '    struct security_hook_list *selected_entry = NULL;\n')
          if old in s:
              s = s.replace(old, new, 1)

          marker = 'static int ksu_lsm_hook_count;\n'
          legacy_macros = (
              '\n#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
              '#define ksu_lsm_for_each_entry(pos, head) list_for_each_entry(pos, head, list)\n'
              '#else\n'
              '#define ksu_lsm_for_each_entry(pos, head) hlist_for_each_entry(pos, head, list)\n'
              '#endif\n'
          )
          if 'ksu_lsm_for_each_entry' not in s:
              if marker not in s:
                  raise SystemExit('LSM macro insertion marker not found')
              s = s.replace(marker, marker + legacy_macros, 1)

          s = s.replace('hlist_for_each_entry (entry, head, list)', 'ksu_lsm_for_each_entry(entry, head)')

          old = ('    head = (struct hlist_head *)heads_addr;\n'
                 '    struct hlist_head *head_end = (struct hlist_head *)(heads_addr + heads_size);\n')
          new = ('#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                 '    head = (struct list_head *)heads_addr;\n'
                 '    struct list_head *head_end = (struct list_head *)(heads_addr + heads_size);\n'
                 '#else\n'
                 '    head = (struct hlist_head *)heads_addr;\n'
                 '    struct hlist_head *head_end = (struct hlist_head *)(heads_addr + heads_size);\n'
                 '#endif\n')
          if old in s:
              s = s.replace(old, new, 1)

          old = 'if (head < (struct hlist_head *)heads_addr || head >= head_end) {'
          new = ('#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                 '                if (head < (struct list_head *)heads_addr || head >= head_end) {\n'
                 '#else\n'
                 '                if (head < (struct hlist_head *)heads_addr || head >= head_end) {\n'
                 '#endif')
          if old in s:
              s = s.replace(old, new, 1)

          offset_start = ('            if (hook->offset) {\n'
                          '                head += hook->offset;\n')
          if offset_start in s and 'KSU 4.14 list_head: offset LSM hook unsupported' not in s:
              offset_new = ('            if (hook->offset) {\n'
                            '#if LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                            '                pr_err("KSU 4.14 list_head: offset LSM hook unsupported\\n");\n'
                            '                ret = -EOPNOTSUPP;\n'
                            '                goto out_unlock;\n'
                            '#else\n'
                            '                head += hook->offset;\n')
              s = s.replace(offset_start, offset_new, 1)
              needle = ('                    selected_origin = NULL;\n'
                        '                }\n'
                        '            }\n'
                        '            break;\n')
              repl = ('                    selected_origin = NULL;\n'
                      '                }\n'
                      '#endif\n'
                      '            }\n'
                      '            break;\n')
              if needle not in s:
                  raise SystemExit('Could not close legacy LSM offset guard')
              s = s.replace(needle, repl, 1)

          old = ('#else\n'
                 '    if (hook->entry == &hook->list) {\n'
                 '        slot = (void **)&hook->list.head->first;\n'
                 '        pr_info("unhook patch head->first\\n");\n'
                 '    } else {\n'
                 '        slot = (void **)((char *)hook->entry + hook->hook_offset);\n'
                 '        pr_info("unhook patch slot\\n");\n'
                 '    }\n'
                 '#endif\n')
          new = ('#elif LINUX_VERSION_CODE < KERNEL_VERSION(4, 17, 0)\n'
                 '    slot = (void **)((char *)hook->entry + hook->hook_offset);\n'
                 '    pr_info("unhook legacy list_head slot\\n");\n'
                 '#else\n'
                 '    if (hook->entry == &hook->list) {\n'
                 '        slot = (void **)&hook->list.head->first;\n'
                 '        pr_info("unhook patch head->first\\n");\n'
                 '    } else {\n'
                 '        slot = (void **)((char *)hook->entry + hook->hook_offset);\n'
                 '        pr_info("unhook patch slot\\n");\n'
                 '    }\n'
                 '#endif\n')
          if old in s:
              s = s.replace(old, new, 1)

          if 'ksu_lsm_for_each_entry' not in s:
              raise SystemExit('Legacy LSM iterator patch failed')
          if 'struct list_head *head;' not in s:
              raise SystemExit('Legacy LSM head type patch failed')
          if 'unhook legacy list_head slot' not in s:
              raise SystemExit('Legacy LSM unhook patch failed')
          p.write_text(s)
          PY

          python3 ../scripts/patch_ksun_414_patch_memory.py .
          python3 ../scripts/patch_ksun_414_su_mount_ns.py .

          echo "=== Compatibility patch verification ==="
          grep -n 'NO_YAML' scripts/dtc/Makefile
          grep -n 'cmd_mkdtimg' scripts/Makefile.lib
          grep -n -E 'dt_entry_buf = |__metadata = ' scripts/dtc/mkdtboimg.py | head
          grep -n -E 'syscall_fn_t|ksu_close_fd' KernelSU-Next/kernel/hook/syscall_hook.h KernelSU-Next/kernel/include/util.h\n          grep -n 'KSU 4.14 ni_syscall fallback' KernelSU-Next/kernel/hook/arm64/syscall_hook.c
          grep -n 'linux/uaccess.h' KernelSU-Next/kernel/hook/syscall_event_bridge.c
          grep -n -E 'KSU_LEGACY_414_PATCH_MEMORY_COMPAT|__pte_to_phys|copy_to_kernel_nofault|ksu_flush_icache' \
            KernelSU-Next/kernel/hook/arm64/patch_memory.c
          grep -n 'KSU 4.14 single-write' KernelSU-Next/kernel/hook/arm64/patch_memory.c
          grep -n -E 'ksu_lsm_for_each_entry|struct list_head \*head|offset LSM hook unsupported|unhook legacy list_head' \
            KernelSU-Next/kernel/hook/lsm_hook.c
          grep -n -E 'KSU_LEGACY_414_SU_MOUNT_NS_COMPAT|uapi/linux/mount.h' \
           KernelSU-Next/kernel/infra/su_mount_ns.c


      - name: Add Linux 4.14 link compatibility shim
        working-directory: kernel
        run: |
          cp ../patch/ksu_compat_414.c KernelSU-Next/kernel/compat_414.c
          if ! grep -q 'compat_414.o' KernelSU-Next/kernel/Kbuild; then
            sed -i '/^kernelsu-objs := core\/init.o/a\kernelsu-objs += compat_414.o' KernelSU-Next/kernel/Kbuild
          fi
          test -s KernelSU-Next/kernel/compat_414.c
          grep -q 'compat_414.o' KernelSU-Next/kernel/Kbuild

      - name: Configure cepheus kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "${DEFCONFIG}"
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KPROBES
          ./scripts/config --file out/.config --enable KPROBE_EVENTS
          ./scripts/config --file out/.config --enable KSU_KPROBE_HOOKS || true
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- olddefconfig
          echo "Relevant final config:"
          grep -E 'CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)=' out/.config || true

      - name: Build Image.gz-dtb
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "Toolchain versions:"
          clang --version | head -n1
          aarch64-linux-gnu-ld --version | head -n1
          arm-linux-gnueabi-ld --version | head -n1

          make \
            O=out ARCH=arm64 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)"

          test -f out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee ../Image.gz-dtb.sha256

      - name: Prepare AnyKernel3 flashable ZIP
        working-directory: kernel
        run: |
          if [ ! -d AnyKernel3 ] || [ ! -f AnyKernel3/anykernel.sh ]; then
            rm -rf AnyKernel3
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          if [ -f AnyKernel3/anykernel.sh ]; then
            sed -i \
              -e 's/^device\.name1=.*/device.name1=cepheus/' \
              -e 's/^device\.name2=.*/device.name2=/' \
              -e 's/^device\.name3=.*/device.name3=/' \
              -e 's/^device\.name4=.*/device.name4=/' \
              -e 's/^device\.name5=.*/device.name5=/' \
              -e 's|^kernel\.string=.*|kernel.string=InfiniR 4.14.355 for Xiaomi Mi 9 (cepheus)|' \
              -e 's|^BLOCK=.*|BLOCK=auto;|' \
              -e 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' \
              AnyKernel3/anykernel.sh
            sed -i '/^# init.rc$/,/^write_boot;/ { /^write_boot;/!d; }' AnyKernel3/anykernel.sh
          fi
          grep -q '^device.name1=cepheus$' AnyKernel3/anykernel.sh
          grep -q '^BLOCK=auto;$' AnyKernel3/anykernel.sh
          grep -q '^IS_SLOT_DEVICE=auto;$' AnyKernel3/anykernel.sh
          if grep -q '^BLOCK=.*omap' AnyKernel3/anykernel.sh; then
            echo "Refusing to package AnyKernel3 with an OMAP boot block"
            exit 1
          fi
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' '.github/*' 'README.md' '*.zip'
          cd ..
          test -f "${ZIP_NAME}"
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"

      - name: Build report
        working-directory: kernel
        run: |
          {
            echo "Device: Xiaomi Mi 9 (cepheus)"
            echo "ROM target: crDroid 12.11 / Android 16"
            echo "Kernel source: ${KERNEL_REPO} branch ${KERNEL_BRANCH}"
            echo "Kernel version: $(make kernelversion)"
            echo "KernelSU-Next target: ${KSUN_TAG} / manager build 33214"
            echo "Experiment: resolve the legacy ni_syscall symbol and allow only the dispatcher-slot write"
            echo "Expected result: dispatcher uses an unused syscall slot while direct syscall 63/80 writes remain blocked; flash only with recovery available"
            echo
            echo "ZIP SHA256:"
            cat "${ZIP_NAME}.sha256"
          } | tee build-report.txt

      - name: Upload flashable package
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-cepheus-4.14.355-KSUN-33214-EXPERIMENTAL-NISLOT-DISPATCHER
          path: |
            kernel/${{ env.ZIP_NAME }}
            kernel/${{ env.ZIP_NAME }}.sha256
            kernel/build-report.txt
            Image.gz-dtb.sha256
          if-no-files-found: error
          retention-days: 14

name: Mi9 crDroid A16 - Linux 4.14.355 + KSUN 33214

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_cepheus.git
      KERNEL_BRANCH: "16.0"
      DEFCONFIG: cepheus_defconfig
      KSUN_TAG: v3.3.0
      ZIP_NAME: InfiniR-cepheus-4.14.355-A16-KSUN-v3.3.0-33214.zip

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 rsync unzip zip \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone crDroid cepheus Android 16 kernel
        run: |
          git clone --depth=1 --branch "${KERNEL_BRANCH}" \
            "${KERNEL_REPO}" kernel
          cd kernel
          echo "Source commit:"
          git rev-parse HEAD
          echo "Kernel version from Makefile:"
          make kernelversion

      - name: Integrate KernelSU-Next v3.3.0
        working-directory: kernel
        run: |
          rm -rf KernelSU KernelSU-Next
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${KSUN_TAG}"
          echo "KernelSU integration paths:"
          find . -maxdepth 2 -type d \( -name 'KernelSU*' -o -name 'kernelsu*' \) -print

      - name: Patch legacy build compatibility
        working-directory: kernel
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Legacy DTC host build: avoid YAML host-link dependency.
          p = Path('scripts/dtc/Makefile')
          s = p.read_text()
          old = """ifeq ($(shell pkg-config --exists yaml-0.1 2>/dev/null && echo yes),)\nHOST_EXTRACFLAGS += -DNO_YAML\nelse\ndtc-objs\t+= yamltree.o\nHOSTLDLIBS_dtc\t:= $(shell pkg-config yaml-0.1 --libs)\nendif\n"""
          new = "HOST_EXTRACFLAGS += -DNO_YAML\n"
          if old in s:
              s = s.replace(old, new)
          elif '-DNO_YAML' not in s:
              raise SystemExit('Expected YAML block not found in scripts/dtc/Makefile')
          p.write_text(s)

          # The tree hard-codes python2 for mkdtboimg. Run it with Python 3.
          p = Path('scripts/Makefile.lib')
          s = p.read_text()
          old = 'cmd_mkdtimg = python2 $(srctree)/scripts/dtc/mkdtboimg.py create $@ --page_size=4096 $(filter-out FORCE,$^)'
          new = 'cmd_mkdtimg = python3 $(srctree)/scripts/dtc/mkdtboimg.py create $@ --page_size=4096 $(filter-out FORCE,$^)'
          if old in s:
              s = s.replace(old, new)
          elif 'cmd_mkdtimg = python3 ' not in s:
              raise SystemExit('Expected mkdtimg command not found')
          p.write_text(s)

          # Complete Python 2 -> Python 3 compatibility for the bundled script.
          p = Path('scripts/dtc/mkdtboimg.py')
          s = p.read_text()
          s = s.replace('xrange(', 'range(')
          s = s.replace('if version is 0:', 'if version == 0:')
          # DT payloads are bytes under Python 3. The original Python 2 empty
          # string acted as a byte buffer; make that explicit for Python 3.
          if '        dt_entry_buf = ""\n' in s:
              s = s.replace('        dt_entry_buf = ""\n', '        dt_entry_buf = b""\n', 1)
          elif '        dt_entry_buf = b""\n' not in s:
              raise SystemExit('Expected dt_entry_buf initializer not found')
          p.write_text(s)

          # KernelSU-Next v3.3.0 arm64 uses syscall_fn_t without defining it.
          p = Path('KernelSU-Next/kernel/hook/syscall_hook.h')
          s = p.read_text()
          old = """#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n#endif\n"""
          new = """#if defined(__x86_64__)\ntypedef sys_call_ptr_t syscall_fn_t;\n#elif defined(__aarch64__)\ntypedef long (*syscall_fn_t)(const struct pt_regs *regs);\n#endif\n"""
          if old in s:
              s = s.replace(old, new)
          elif 'typedef long (*syscall_fn_t)(const struct pt_regs *regs);' not in s:
              raise SystemExit('Expected syscall_fn_t block not found in KernelSU-Next')
          p.write_text(s)

          # v3.3.0 sulog.h uses __init/__exit but does not include linux/init.h.
          p = Path('KernelSU-Next/kernel/feature/sulog.h')
          s = p.read_text()
          if '#include <linux/init.h>' not in s:
              s = s.replace('#include <linux/types.h>\n', '#include <linux/types.h>\n#include <linux/init.h>\n')
          p.write_text(s)

          # linux/pgtable.h is not present in this 4.14 Qualcomm tree.
          # arm64 provides the required page-table interfaces via asm/pgtable.h.
          p = Path('KernelSU-Next/kernel/feature/sucompat.c')
          s = p.read_text()
          if '#include <linux/pgtable.h>' in s:
              s = s.replace('#include <linux/pgtable.h>', '#include <asm/pgtable.h>')
          elif '#include <asm/pgtable.h>' not in s:
              raise SystemExit('Expected pgtable include not found in sucompat.c')
          p.write_text(s)
          PY

          echo "DTC YAML setting:"
          grep -n 'NO_YAML' scripts/dtc/Makefile
          echo "DTBO Python command:"
          grep -n 'cmd_mkdtimg' scripts/Makefile.lib
          echo "DTBO byte buffer:"
          grep -n 'dt_entry_buf = ' scripts/dtc/mkdtboimg.py | head
          echo "Remaining xrange calls:"
          grep -n 'xrange(' scripts/dtc/mkdtboimg.py || true
          echo "KernelSU syscall_fn_t definitions:"
          sed -n '1,18p' KernelSU-Next/kernel/hook/syscall_hook.h
          echo "KernelSU sulog includes:"
          sed -n '1,14p' KernelSU-Next/kernel/feature/sulog.h
          echo "KernelSU sucompat pgtable include:"
          grep -n 'pgtable.h' KernelSU-Next/kernel/feature/sucompat.c

      - name: Configure cepheus kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          rm -rf out
          mkdir -p out
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- "${DEFCONFIG}"
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --enable KPROBES
          ./scripts/config --file out/.config --enable KPROBE_EVENTS
          ./scripts/config --file out/.config --enable KSU_KPROBE_HOOKS || true
          yes "" | make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- olddefconfig
          echo "Relevant final config:"
          grep -E 'CONFIG_(KSU|KPROBES|KPROBE_EVENTS|KSU_KPROBE_HOOKS)=' out/.config || true

      - name: Build Image.gz-dtb
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CC=clang
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "Toolchain versions:"
          clang --version | head -n1
          aarch64-linux-gnu-ld --version | head -n1
          arm-linux-gnueabi-ld --version | head -n1

          make \
            O=out ARCH=arm64 \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)"

          test -f out/arch/arm64/boot/Image.gz-dtb
          file out/arch/arm64/boot/Image.gz-dtb
          sha256sum out/arch/arm64/boot/Image.gz-dtb | tee ../Image.gz-dtb.sha256

      - name: Prepare AnyKernel3 flashable ZIP
        working-directory: kernel
        run: |
          if [ ! -d AnyKernel3 ] || [ ! -f AnyKernel3/anykernel.sh ]; then
            rm -rf AnyKernel3
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          if [ -f AnyKernel3/anykernel.sh ]; then
            sed -i \
              -e 's/^device\.name1=.*/device.name1=cepheus/' \
              -e 's/^device\.name2=.*/device.name2=/' \
              -e 's/^device\.name3=.*/device.name3=/' \
              -e 's/^device\.name4=.*/device.name4=/' \
              -e 's/^device\.name5=.*/device.name5=/' \
              AnyKernel3/anykernel.sh || true
          fi
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x '.git/*' '.github/*' 'README.md' '*.zip'
          cd ..
          test -f "${ZIP_NAME}"
          sha256sum "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"

      - name: Build report
        working-directory: kernel
        run: |
          {
            echo "Device: Xiaomi Mi 9 (cepheus)"
            echo "ROM target: crDroid 12.11 / Android 16"
            echo "Kernel source: ${KERNEL_REPO} branch ${KERNEL_BRANCH}"
            echo "Kernel version: $(make kernelversion)"
            echo "KernelSU-Next target: ${KSUN_TAG} / manager build 33214"
            echo
            echo "ZIP SHA256:"
            cat "${ZIP_NAME}.sha256"
          } | tee build-report.txt

      - name: Upload flashable package
        uses: actions/upload-artifact@v4
        with:
          name: Mi9-cepheus-4.14.355-KSUN-33214
          path: |
            kernel/${{ env.ZIP_NAME }}
            kernel/${{ env.ZIP_NAME }}.sha256
            kernel/build-report.txt
            Image.gz-dtb.sha256
          if-no-files-found: error
          retention-days: 14
